<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Monitor outer bezel (~10% padding baked in: starts at 14,18) -->
  <rect x="14" y="18" width="100" height="70" rx="10" ry="10" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
  <!-- Monitor screen -->
  <rect x="20" y="24" width="88" height="58" rx="6" ry="6" fill="url(#screenGrad)" fill-opacity="0.22"/>
  <!-- Subtle UI window inside screen -->
  <rect x="26" y="30" width="54" height="36" rx="4" ry="4" fill="#0F172A" fill-opacity="0.75" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="33" cy="36" r="2" fill="#F87171"/>
  <circle cx="40" cy="36" r="2" fill="#FBBF24"/>
  <circle cx="47" cy="36" r="2" fill="#34D399"/>
  <line x1="32" y1="46" x2="66" y2="46" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="56" y2="54" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Target reticle -->
  <circle cx="76" cy="54" r="10" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Monitor stand -->
  <path d="M54 88 L50 104 L78 104 L74 88 Z" fill="#475569"/>
  <rect x="40" y="103" width="48" height="6" rx="3" fill="#64748B"/>
  <!-- Crisp pointer cursor -->
  <path d="M76 54 L76 92 L85 83 L92 98 L98 95 L91 80 L103 79 Z" fill="url(#cursorGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
